<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII 艺术生成器 - WorkBuddy Tools</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="tool-container">
    <header class="tool-header">
      <h1>🎭 ASCII 艺术生成器</h1>
      <p>将图片转换为字符艺术</p>
    </header>
    
    <main class="converter">
      <div class="upload-area">
        <label for="image-input">拖拽图片或点击选择</label>
        <input type="file" id="image-input" accept="image/*">
        <p class="hint">支持 JPG, PNG, GIF 等格式</p>
      </div>
      
      <div class="options" style="margin-top:1.5rem;">
        <div class="option-row">
          <label>字符密度</label>
          <select id="density-select">
            <option value="dense">密集 (默认)</option>
            <option value="normal">正常</option>
            <option value="sparse">稀疏</option>
          </select>
        </div>
        
        <div class="option-row">
          <label>字符集</label>
          <select id="charset-select">
            <option value="ascii">ASCII 字符</option>
            <option value="block">方块字符</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        
        <div class="option-row">
          <label>大小</label>
          <input type="number" id="size-input" value="20" min="10" max="100">
          <span>字符数</span>
        </div>
      </div>
      
      <div class="preview-area" style="margin-top:2rem;">
        <h4>预览</h4>
        <pre id="ascii-output" style="white-space: pre; font-family: 'Courier New', monospace; font-size:12px; background:#fafafa; padding:1rem; border:1px solid #ddd; min-height:100px; max-height:300px; overflow:auto;"></pre>
      </div>
      
      <div class="actions" style="margin-top:1.5rem;">
        <button class="copy-btn">复制 ASCII 艺术</button>
        <button class="download-btn">下载 .txt 文件</button>
      </div>
    </main>
    
    <footer class="tool-footer">
      <p>WorkBuddy Tools Collection</p>
    </footer>
  </div>

  <script src="../script.js"></script>
</body>
</html>
